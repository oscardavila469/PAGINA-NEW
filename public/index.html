<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat privado</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --text:#1c1e21; --muted:#6b7280; --me:#2563eb; --me-text:#fff; --them:#e5e7eb; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --panel:#181b21; --text:#e8eaed; --muted:#9aa0a6; --me:#3b82f6; --them:#262a33; --line:#2a2e37; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
  .hidden { display: none !important; }
  #login { display:flex; align-items:center; justify-content:center; height:100%; padding:16px; }
  #login form { background:var(--panel); padding:28px; border-radius:14px; width:100%; max-width:340px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
  #login h1 { margin:0 0 18px; font-size:20px; }
  input[type=text], input[type=password], textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); font:inherit; }
  #login input { margin-bottom:10px; }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:10px 16px; background:var(--me); color:#fff; }
  button.ghost { background:transparent; color:var(--muted); padding:6px 10px; }
  #err { color:#dc2626; font-size:13px; min-height:18px; margin-top:8px; }
  #app { display:flex; flex-direction:column; height:100%; max-width:820px; margin:0 auto; background:var(--panel); }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
  header .name { font-weight:600; }
  header .status { font-size:12px; color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; background:#9ca3af; display:inline-block; margin-right:6px; }
  .dot.on { background:#22c55e; }
  header .sp { flex:1; }
  #msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:6px; }
  .day { align-self:center; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .m { max-width:78%; padding:8px 12px; border-radius:16px; background:var(--them); word-wrap:break-word; white-space:pre-wrap; }
  .m.me { align-self:flex-end; background:var(--me); color:var(--me-text); border-bottom-right-radius:4px; }
  .m.them { align-self:flex-start; border-bottom-left-radius:4px; }
  .m .t { display:block; font-size:11px; opacity:.65; margin-top:2px; text-align:right; }
  .m img { max-width:100%; max-height:320px; border-radius:10px; display:block; margin-bottom:4px; }
  .m a.file { color:inherit; text-decoration:underline; }
  #typing { height:18px; padding:0 18px; font-size:12px; color:var(--muted); }
  #bar { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); align-items:flex-end; position:relative; }
  #bar textarea { resize:none; max-height:140px; }
  #attach, #emojiBtn { background:transparent; color:var(--muted); font-size:20px; padding:6px 10px; }
  #emojiPanel { position:absolute; bottom:56px; left:12px; width:280px; max-height:220px; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 28px rgba(0,0,0,.18); padding:8px; display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; }
  #emojiPanel button { background:transparent; padding:4px; font-size:20px; border-radius:8px; line-height:1; }
  #emojiPanel button:hover { background:var(--them); }
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h1>🔒 Chat privado</h1>
    <input type="text" id="u" placeholder="Usuario" autocomplete="username" required>
    <input type="password" id="p" placeholder="Contraseña" autocomplete="current-password" required>
    <button style="width:100%">Entrar</button>
    <div id="err"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div>
      <div class="name" id="other">—</div>
      <div class="status"><span class="dot" id="dot"></span><span id="st">desconectado</span></div>
    </div>
    <div class="sp"></div>
    <button class="ghost" id="logout">Salir</button>
  </header>
  <div id="msgs"></div>
  <div id="typing"></div>
  <div id="bar">
    <div id="emojiPanel" class="hidden"></div>
    <button id="emojiBtn" title="Emojis">😀</button>
    <button id="attach" title="Adjuntar archivo">📎</button>
    <input type="file" id="file" class="hidden">
    <textarea id="text" rows="1" placeholder="Escribe un mensaje…"></textarea>
    <button id="send">Enviar</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let me = null, other = null, ws = null, lastDay = '', typingTimer = null, lastTypingSent = 0;
let unread = 0;
const baseTitle = document.title;
let audioCtx = null;

function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);
    o.stop(audioCtx.currentTime + 0.25);
  } catch {}
}

function notifyIncoming(msg) {
  if (document.hasFocus()) return; // ya la estás viendo, no hace falta avisar
  unread++;
  document.title = `(${unread}) ${baseTitle}`;
  beep();
  if ('Notification' in window && Notification.permission === 'granted') {
    const body = msg.file ? `📎 ${msg.file.name}` : msg.text;
    const n = new Notification(msg.from, { body, tag: 'chat-privado' });
    n.onclick = () => { window.focus(); n.close(); };
  }
}

window.addEventListener('focus', () => { unread = 0; document.title = baseTitle; });

async function api(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('err').textContent = '';
  try {
    await api('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: $('u').value.trim(), pass: $('p').value }) });
    start();
  } catch (er) { $('err').textContent = er.message; }
});

$('logout').onclick = async () => { await api('/api/logout', { method: 'POST' }); location.reload(); };

async function start() {
  try {
    const j = await api('/api/me');
    me = j.user; other = j.others[0] || '—';
  } catch { return; }
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('other').textContent = other;
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  connect();
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    if (d.type === 'history') { $('msgs').innerHTML = ''; lastDay = ''; d.messages.forEach(render); scrollDown(); }
    else if (d.type === 'msg') {
      render(d.message); scrollDown();
      if (d.message.from !== me) notifyIncoming(d.message);
    }
    else if (d.type === 'presence') {
      const o = d.users.find((x) => x.user === other);
      $('dot').classList.toggle('on', !!(o && o.online));
      $('st').textContent = o && o.online ? 'en línea' : 'desconectado';
    } else if (d.type === 'typing') {
      $('typing').textContent = d.user + ' está escribiendo…';
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => ($('typing').textContent = ''), 2000);
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

function scrollDown() { const m = $('msgs'); m.scrollTop = m.scrollHeight; }

function render(msg) {
  const d = new Date(msg.ts);
  const day = d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
  if (day !== lastDay) {
    const s = document.createElement('div'); s.className = 'day'; s.textContent = day; $('msgs').appendChild(s); lastDay = day;
  }
  const el = document.createElement('div');
  el.className = 'm ' + (msg.from === me ? 'me' : 'them');
  if (msg.file) {
    const url = '/api/file/' + msg.file.id;
    if (/^image\/(png|jpe?g|gif|webp)$/.test(msg.file.type)) {
      const a = document.createElement('a'); a.href = url; a.target = '_blank';
      const img = document.createElement('img'); img.src = url; img.alt = msg.file.name; a.appendChild(img); el.appendChild(a);
    } else {
      const a = document.createElement('a'); a.className = 'file'; a.href = url; a.textContent = '📄 ' + msg.file.name + ' (' + fmt(msg.file.size) + ')'; el.appendChild(a);
      el.appendChild(document.createElement('br'));
    }
  }
  if (msg.text) el.appendChild(document.createTextNode(msg.text));
  const t = document.createElement('span'); t.className = 't'; t.textContent = d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  el.appendChild(t);
  $('msgs').appendChild(el);
}

function fmt(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

function sendText() {
  const v = $('text').value;
  if (!v.trim() || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'msg', text: v }));
  $('text').value = ''; $('text').style.height = 'auto';
}
$('send').onclick = sendText;
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });
$('text').addEventListener('input', (e) => {
  e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px';
  if (Date.now() - lastTypingSent > 1000 && ws && ws.readyState === 1) { ws.send(JSON.stringify({ type: 'typing' })); lastTypingSent = Date.now(); }
});

const EMOJIS = ['😀','😂','😍','😊','😉','😘','🥰','😎','🤔','😅','😢','😭','😡','😴','😮','🙄','😇','🤗','🥳','😏',
  '👍','👎','👏','🙏','💪','🤝','✋','👌','🤞','🫶','❤️','💔','💕','💯','🔥','✨','🎉','🎂','🌟','☀️',
  '🌙','☕','🍕','🍔','🍺','🍷','⚽','🏀','🚗','✈️','📍','📞','⏰','📌','✅','❌','❓','❗','💤','🎵'];
const panel = $('emojiPanel');
EMOJIS.forEach((e) => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = e;
  b.onclick = () => insertEmoji(e);
  panel.appendChild(b);
});
function insertEmoji(e) {
  const t = $('text');
  const start = t.selectionStart ?? t.value.length, end = t.selectionEnd ?? t.value.length;
  t.value = t.value.slice(0, start) + e + t.value.slice(end);
  t.focus();
  t.selectionStart = t.selectionEnd = start + e.length;
  t.dispatchEvent(new Event('input'));
}
$('emojiBtn').onclick = (ev) => { ev.stopPropagation(); panel.classList.toggle('hidden'); };
document.addEventListener('click', (ev) => {
  if (!panel.classList.contains('hidden') && !panel.contains(ev.target) && ev.target !== $('emojiBtn')) panel.classList.add('hidden');
});

$('attach').onclick = () => $('file').click();
$('file').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const meta = await api('/api/upload', { method: 'POST', headers: { 'X-Filename': encodeURIComponent(f.name), 'Content-Type': f.type || 'application/octet-stream' }, body: f });
    ws.send(JSON.stringify({ type: 'msg', text: '', file: meta }));
  } catch (er) { alert(er.message); }
});

start();
</script>
</body>
</html>
