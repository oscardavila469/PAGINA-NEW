<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Notas</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --text:#1c1e21; --muted:#6b7280; --me:#2563eb; --me-text:#fff; --them:#e5e7eb; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --panel:#181b21; --text:#e8eaed; --muted:#9aa0a6; --me:#3b82f6; --them:#262a33; --line:#2a2e37; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; color: var(--text);
    background-color: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, rgba(127,127,127,.18) 1px, transparent 0);
    background-size: 22px 22px;
  }
  .hidden { display: none !important; }
  #login { display:flex; align-items:center; justify-content:center; height:100%; padding:16px; }
  #login form { background:var(--panel); padding:28px; border-radius:14px; width:100%; max-width:340px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
  #login h1 { margin:0 0 18px; font-size:20px; }
  input[type=text], input[type=password], textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); font:inherit; }
  #login input { margin-bottom:10px; }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:10px 16px; background:var(--me); color:#fff; }
  button.ghost { background:transparent; color:var(--muted); padding:6px 10px; }
  #err { color:#dc2626; font-size:13px; min-height:18px; margin-top:8px; }
  #app { display:flex; flex-direction:column; height:100%; max-width:820px; margin:0 auto; background:var(--panel); position:relative; }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
  header .name { font-weight:600; }
  header .status { font-size:12px; color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; background:#9ca3af; display:inline-block; margin-right:6px; }
  .dot.on { background:#22c55e; }
  header .sp { flex:1; }
  #msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:6px; }
  .day { align-self:center; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .row { display:flex; align-items:flex-end; gap:4px; }
  .row.me { justify-content:flex-end; }
  .row.them { justify-content:flex-start; }
  .row.flash .m { animation: flashbg 1s ease; }
  @keyframes flashbg { 0% { filter:brightness(1.6); } 100% { filter:none; } }
  .replyBtn { background:transparent; color:var(--muted); opacity:.4; font-size:13px; padding:5px 7px; border-radius:50%; flex:0 0 auto; }
  .replyBtn:hover { opacity:1; background:var(--them); }
  .row.me .replyBtn { order:-1; }
  .m { max-width:78%; padding:8px 12px; border-radius:16px; background:var(--them); word-wrap:break-word; white-space:pre-wrap; }
  .m.me { background:var(--me); color:var(--me-text); border-bottom-right-radius:4px; }
  .m.them { border-bottom-left-radius:4px; }
  .m .quote { border-left:3px solid currentColor; opacity:.85; padding:3px 8px; margin-bottom:5px; font-size:12.5px; border-radius:4px; background:rgba(0,0,0,.08); cursor:pointer; }
  .m.me .quote { background:rgba(255,255,255,.18); }
  .m .quote b { display:block; font-size:11px; }
  .m .t { display:block; font-size:11px; opacity:.7; margin-top:2px; text-align:right; }
  .m .tick { margin-left:3px; }
  .m.me .tick.read { color:#bbf7d0; }
  .m img { max-width:100%; max-height:320px; border-radius:10px; display:block; margin-bottom:4px; }
  .m a.file { color:inherit; text-decoration:underline; }
  #typing { height:18px; padding:0 18px; font-size:12px; color:var(--muted); }
  #replyBar { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 16px; border-top:1px solid var(--line); background:var(--bg); font-size:13px; }
  #replyBar .info { border-left:3px solid var(--me); padding-left:8px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  #replyBar .info b { color:var(--text); }
  #bar { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); align-items:flex-end; position:relative; }
  #bar textarea { resize:none; max-height:140px; }
  #attach, #emojiBtn { background:transparent; color:var(--muted); font-size:20px; padding:6px 10px; }
  #emojiPanel { position:absolute; bottom:56px; left:12px; width:300px; max-height:240px; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 28px rgba(0,0,0,.18); padding:8px; display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; }
  #emojiPanel button { background:transparent; padding:4px; font-size:19px; border-radius:8px; line-height:1; }
  #emojiPanel button:hover { background:var(--them); }
  #dropHint { position:absolute; inset:0; background:rgba(37,99,235,.15); border:3px dashed var(--me); display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--me); font-weight:600; z-index:50; }
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h1>📝 Notas</h1>
    <input type="text" id="u" placeholder="Usuario" autocomplete="username" required>
    <input type="password" id="p" placeholder="Contraseña" autocomplete="current-password" required>
    <button style="width:100%">Entrar</button>
    <div id="err"></div>
  </form>
</div>

<div id="app" class="hidden">
  <div id="dropHint" class="hidden">Suelta aquí para enviar</div>
  <header>
    <div>
      <div class="name" id="other">—</div>
      <div class="status"><span class="dot" id="dot"></span><span id="st">desconectado</span></div>
    </div>
    <div class="sp"></div>
    <button class="ghost" id="logout">Salir</button>
  </header>
  <div id="msgs"></div>
  <div id="typing"></div>
  <div id="replyBar" class="hidden"></div>
  <div id="bar">
    <div id="emojiPanel" class="hidden"></div>
    <button id="emojiBtn" title="Emojis">😀</button>
    <button id="attach" title="Adjuntar archivo">📎</button>
    <input type="file" id="file" class="hidden">
    <textarea id="text" rows="1" placeholder="Escribe un mensaje…"></textarea>
    <button id="send">Enviar</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let me = null, other = null, ws = null, lastDay = '', typingTimer = null, lastTypingSent = 0;
let unread = 0, lastMsgTs = 0, replyingTo = null, readState = {};
const baseTitle = document.title;
let audioCtx = null;

function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);
    o.stop(audioCtx.currentTime + 0.25);
  } catch {}
}

function notifyIncoming(msg) {
  if (document.hasFocus()) return; // ya la estás viendo, no hace falta avisar
  unread++;
  document.title = `(${unread}) ${baseTitle}`;
  beep();
  if ('Notification' in window && Notification.permission === 'granted') {
    const body = msg.file ? `📎 ${msg.file.name}` : msg.text;
    const n = new Notification(msg.from, { body, tag: 'notas-msg' });
    n.onclick = () => { window.focus(); n.close(); };
  }
}

window.addEventListener('focus', () => {
  unread = 0; document.title = baseTitle;
  if (lastMsgTs) sendRead(lastMsgTs);
});

async function api(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('err').textContent = '';
  try {
    await api('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: $('u').value.trim(), pass: $('p').value }) });
    start();
  } catch (er) { $('err').textContent = er.message; }
});

$('logout').onclick = async () => { await api('/api/logout', { method: 'POST' }); location.reload(); };

async function start() {
  try {
    const j = await api('/api/me');
    me = j.user; other = j.others[0] || '—';
  } catch { return; }
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('other').textContent = other;
  if ('Notification' in window) {
    if (Notification.permission === 'default') {
      Notification.requestPermission().then((p) => { if (p === 'granted') setupPush(); });
    } else if (Notification.permission === 'granted') {
      setupPush();
    }
  }
  connect();
}

// ---------- Notificaciones push: avisan aunque el navegador esté cerrado ----------
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}
async function setupPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    const { key } = await api('/api/vapid-public-key');
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(key) });
    await api('/api/push-subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sub) });
  } catch (e) { console.warn('No se pudo activar el aviso push:', e); }
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    if (d.type === 'history') {
      $('msgs').innerHTML = ''; lastDay = '';
      d.messages.forEach(render);
      scrollDown();
      if (document.hasFocus() && lastMsgTs) sendRead(lastMsgTs);
    } else if (d.type === 'msg') {
      render(d.message); scrollDown();
      if (d.message.from !== me) {
        if (document.hasFocus()) sendRead(d.message.ts);
        else notifyIncoming(d.message);
      }
    } else if (d.type === 'presence') {
      const o = d.users.find((x) => x.user === other);
      $('dot').classList.toggle('on', !!(o && o.online));
      $('st').textContent = o && o.online ? 'en línea' : 'desconectado';
    } else if (d.type === 'typing') {
      $('typing').textContent = d.user + ' está escribiendo…';
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => ($('typing').textContent = ''), 2000);
    } else if (d.type === 'readstate') {
      readState = d.state || {};
      updateReadTicks();
    } else if (d.type === 'read_update') {
      readState[d.user] = d.upto;
      updateReadTicks();
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

function sendRead(ts) {
  if (ws && ws.readyState === 1 && ts) ws.send(JSON.stringify({ type: 'read', upto: ts }));
}

function updateReadTicks() {
  const otherRead = readState[other] || 0;
  document.querySelectorAll('.row.me').forEach((row) => {
    const ts = Number(row.dataset.ts);
    const tick = row.querySelector('.tick');
    if (!tick) return;
    const read = ts <= otherRead;
    tick.textContent = read ? '✓✓' : '✓';
    tick.classList.toggle('read', read);
  });
}

function scrollDown() { const m = $('msgs'); m.scrollTop = m.scrollHeight; }

function quotePreview(msg) {
  return msg.text ? msg.text : (msg.file ? `📎 ${msg.file.name}` : '');
}

function render(msg) {
  const d = new Date(msg.ts);
  const day = d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
  if (day !== lastDay) {
    const s = document.createElement('div'); s.className = 'day'; s.textContent = day; $('msgs').appendChild(s); lastDay = day;
  }
  lastMsgTs = Math.max(lastMsgTs, msg.ts);

  const mine = msg.from === me;
  const row = document.createElement('div');
  row.className = 'row ' + (mine ? 'me' : 'them');
  row.dataset.id = msg.id;
  row.dataset.ts = msg.ts;

  const replyBtn = document.createElement('button');
  replyBtn.className = 'replyBtn'; replyBtn.type = 'button'; replyBtn.title = 'Responder'; replyBtn.textContent = '↩';
  replyBtn.onclick = () => setReply(msg);

  const el = document.createElement('div');
  el.className = 'm ' + (mine ? 'me' : 'them');

  if (msg.replyTo) {
    const q = document.createElement('div'); q.className = 'quote';
    const who = document.createElement('b'); who.textContent = msg.replyTo.from === me ? 'Tú' : msg.replyTo.from;
    const txt = document.createElement('span'); txt.textContent = msg.replyTo.text;
    q.appendChild(who); q.appendChild(txt);
    q.onclick = () => {
      const target = $('msgs').querySelector(`[data-id="${CSS.escape(msg.replyTo.id)}"]`);
      if (target) { target.scrollIntoView({ behavior: 'smooth', block: 'center' }); target.classList.add('flash'); setTimeout(() => target.classList.remove('flash'), 1000); }
    };
    el.appendChild(q);
  }
  if (msg.file) {
    const url = '/api/file/' + msg.file.id;
    if (/^image\/(png|jpe?g|gif|webp)$/.test(msg.file.type)) {
      const a = document.createElement('a'); a.href = url; a.target = '_blank';
      const img = document.createElement('img'); img.src = url; img.alt = msg.file.name; a.appendChild(img); el.appendChild(a);
    } else {
      const a = document.createElement('a'); a.className = 'file'; a.href = url; a.textContent = '📄 ' + msg.file.name + ' (' + fmt(msg.file.size) + ')'; el.appendChild(a);
      el.appendChild(document.createElement('br'));
    }
  }
  if (msg.text) el.appendChild(document.createTextNode(msg.text));

  const t = document.createElement('span'); t.className = 't';
  t.textContent = d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  if (mine) {
    const tick = document.createElement('span'); tick.className = 'tick'; tick.textContent = '✓';
    t.appendChild(tick);
  }
  el.appendChild(t);

  row.appendChild(replyBtn);
  row.appendChild(el);
  $('msgs').appendChild(row);
  if (mine) updateReadTicks();
}

function fmt(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

function setReply(msg) {
  replyingTo = { id: msg.id, from: msg.from, text: quotePreview(msg).slice(0, 300) };
  renderReplyBar();
  $('text').focus();
}
function clearReply() { replyingTo = null; renderReplyBar(); }
function takeReply() { const r = replyingTo; clearReply(); return r; }
function renderReplyBar() {
  const bar = $('replyBar');
  bar.innerHTML = '';
  if (!replyingTo) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  const info = document.createElement('div'); info.className = 'info';
  const who = document.createElement('b'); who.textContent = (replyingTo.from === me ? 'Tú' : replyingTo.from) + ': ';
  const txt = document.createElement('span'); txt.textContent = replyingTo.text;
  info.appendChild(who); info.appendChild(txt);
  const x = document.createElement('button'); x.className = 'ghost'; x.type = 'button'; x.textContent = '✕';
  x.onclick = clearReply;
  bar.appendChild(info); bar.appendChild(x);
}

function sendText() {
  const v = $('text').value;
  if (!v.trim() || !ws || ws.readyState !== 1) return;
  const replyTo = takeReply();
  ws.send(JSON.stringify({ type: 'msg', text: v, replyTo }));
  $('text').value = ''; $('text').style.height = 'auto';
}
$('send').onclick = sendText;
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });
$('text').addEventListener('input', (e) => {
  e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px';
  if (Date.now() - lastTypingSent > 1000 && ws && ws.readyState === 1) { ws.send(JSON.stringify({ type: 'typing' })); lastTypingSent = Date.now(); }
});

// ---------- Emojis ----------
const EMOJIS = [
  '😀','😁','😂','🤣','😊','😇','🙂','🙃','😉','😍','🥰','😘','😗','😚','😋','😛','😜','🤪','🤨','🧐',
  '🤓','😎','🥳','😏','😒','😞','😔','😟','😕','🙁','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡',
  '🤬','😳','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦','😧',
  '😮','😲','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','😷','🤒','🤕','🥶','🥵','🤯','😇','👻','💀',
  '👍','👎','👏','🙌','🙏','🤝','💪','✋','🖐️','👌','🤞','🤟','🤘','👊','✌️','🫶','👋','🤙','💅','👀',
  '❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❤️‍🔥','💕','💞','💓','💗','💖','💘','💝','💯','✨',
  '🔥','🎉','🎊','🎂','🎁','🌟','⭐','☀️','🌤️','⛅','🌙','⚡','🌈','☕','🍵','🍺','🍷','🥂','🍕','🍔',
  '🍟','🌮','🍣','🍦','🍩','🍫','🥗','🍎','🍌','⚽','🏀','🏈','🎮','🎧','🎵','🎶','🚗','✈️','🏠','📍',
  '📞','⏰','📅','📌','📎','✅','❌','❓','❗','⚠️','💤','🔔','🔒','🔑','💼','📝'
];
const panel = $('emojiPanel');
EMOJIS.forEach((e) => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = e;
  b.onclick = () => insertEmoji(e);
  panel.appendChild(b);
});
function insertEmoji(e) {
  const t = $('text');
  const start = t.selectionStart ?? t.value.length, end = t.selectionEnd ?? t.value.length;
  t.value = t.value.slice(0, start) + e + t.value.slice(end);
  t.focus();
  t.selectionStart = t.selectionEnd = start + e.length;
  t.dispatchEvent(new Event('input'));
}
$('emojiBtn').onclick = (ev) => { ev.stopPropagation(); panel.classList.toggle('hidden'); };
document.addEventListener('click', (ev) => {
  if (!panel.classList.contains('hidden') && !panel.contains(ev.target) && ev.target !== $('emojiBtn')) panel.classList.add('hidden');
});

// ---------- Subida de archivos: selector, pegar (Ctrl+V) y arrastrar y soltar ----------
async function uploadFile(f) {
  if (!f || !ws || ws.readyState !== 1) return;
  try {
    const meta = await api('/api/upload', { method: 'POST', headers: { 'X-Filename': encodeURIComponent(f.name || 'archivo'), 'Content-Type': f.type || 'application/octet-stream' }, body: f });
    const replyTo = takeReply();
    ws.send(JSON.stringify({ type: 'msg', text: '', file: meta, replyTo }));
  } catch (er) { alert(er.message); }
}

$('attach').onclick = () => $('file').click();
$('file').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; uploadFile(f); });

document.addEventListener('paste', (e) => {
  if (!$('app') || $('app').classList.contains('hidden')) return;
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  let handled = false;
  for (const item of items) {
    if (item.kind === 'file') { const f = item.getAsFile(); if (f) { uploadFile(f); handled = true; } }
  }
  if (handled) e.preventDefault();
});

let dragDepth = 0;
$('app').addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; $('dropHint').classList.remove('hidden'); });
$('app').addEventListener('dragover', (e) => e.preventDefault());
$('app').addEventListener('dragleave', (e) => { e.preventDefault(); dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('dropHint').classList.add('hidden'); });
$('app').addEventListener('drop', (e) => {
  e.preventDefault(); dragDepth = 0; $('dropHint').classList.add('hidden');
  const files = e.dataTransfer && e.dataTransfer.files;
  if (files) for (const f of files) uploadFile(f);
});

start();
</script>
</body>
</html>
